<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>机会 · LEAP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" aria-label="主导航">
    <a class="brand" href="index.html">
      <svg class="mark" viewBox="0 0 22 22" fill="none" aria-hidden="true">
        <path d="M3 18h4.5v-4.5H12V9h4.5V4.5H21" stroke="#17181a" stroke-width="2"/>
        <path d="M16.5 4.5H21V9" stroke="#a63a24" stroke-width="2"/>
      </svg>
      <span class="brand-name">LEAP</span>
    </a>
    <div class="scope" role="group" aria-label="当前身份">
      <span>中国政法大学</span><b>· 学生</b>
      <svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5 6 7.5l3-3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>

    <nav aria-label="内容">
      <a class="nav-item" href="index.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.2v3l2 1.3" stroke-linecap="round"/></svg>
        今天
      </a>
      <a class="nav-item" href="competitions.html" aria-current="page">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="6" r="3.2"/><path d="M5.7 8.7 4.6 14l3.4-1.9 3.4 1.9-1.1-5.3" stroke-linejoin="round"/></svg>
        比赛
      </a>
      <a class="nav-item" href="competitions.html?kind=academic">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 13h10M4.6 9.4 11 3l2 2-6.4 6.4-2.6.6.6-2.6Z" stroke-linejoin="round"/></svg>
        征文
      </a>
      <a class="nav-item" href="competitions.html?kind=job">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2.5" y="5.4" width="11" height="7.6" rx="1.2"/><path d="M6 5.4V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.4"/></svg>
        求职
      </a>
    </nav>

    <div class="group-label">我的</div>
    <nav aria-label="我的">
      <a class="nav-item" href="team.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="6" cy="5.8" r="2.3"/><path d="M2.4 13c0-2.1 1.6-3.4 3.6-3.4s3.6 1.3 3.6 3.4" stroke-linecap="round"/><path d="M10.6 4a2.3 2.3 0 0 1 0 3.7M11.2 9.8c1.5.3 2.4 1.4 2.4 3.2" stroke-linecap="round"/></svg>
        我的队伍
      </a>
      <a class="nav-item" href="library.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2.5" y="3.4" width="11" height="3" rx=".6"/><path d="M3.6 6.4v6.2h8.8V6.4M6.4 9h3.2"/></svg>
        资料库
        <span class="count" aria-label="21 份资料">21</span>
      </a>
    </nav>

    <div class="group-label">机构</div>
    <nav aria-label="机构">
      <a class="nav-item" href="school.html">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M2.4 6.5 8 3l5.6 3.5M4.2 6.6v5.2M8 6.6v5.2M11.8 6.6v5.2M2.6 13.4h10.8" stroke-linecap="round"/></svg>
        学校端
        <span class="count" aria-label="18 份待审">18</span>
      </a>
    </nav>

    <div class="bottom">
      <a class="nav-item" href="#">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 5.2h10M3 10.8h10"/><circle cx="6.2" cy="5.2" r="1.7" fill="#fff"/><circle cx="10" cy="10.8" r="1.7" fill="#fff"/></svg>
        设置
      </a>
    </div>
  </aside>

  <main class="canvas">
    <div class="topbar-phone">
      <button class="btn ghost" id="menu" aria-expanded="false" aria-label="打开导航">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke-linecap="round"/></svg>
      </button>
      <span class="brand-name">LEAP</span>
    </div>

    <div class="title-row">
      <div>
        <h1>机会</h1>
        <p class="sub">共 <b id="opp-total">13</b> 条在架信息 · 每条标官方来源与更新时间，过期的自动归档</p>
      </div>
      <div class="title-actions">
        <a class="btn" href="#">订阅关键词</a>
      </div>
    </div>

    <div class="filters" role="group" aria-label="筛选">
      <div class="segmented">
        <button data-kind="all" aria-pressed="true">全部 <span class="mono small" data-kind-count="all"></span></button>
        <button data-kind="competition" aria-pressed="false">比赛 <span class="mono small" data-kind-count="competition"></span></button>
        <button data-kind="academic" aria-pressed="false">征文 <span class="mono small" data-kind-count="academic"></span></button>
        <button data-kind="job" aria-pressed="false">求职 <span class="mono small" data-kind-count="job"></span></button>
      </div>
      <button class="chip" id="near" aria-pressed="false">只看 14 天内</button>
      <span class="spacer"></span>
      <span class="stamp">按截止日升序</span>
      <div class="segmented seg-view" role="group" aria-label="列表密度">
        <button data-view="detail" aria-pressed="true">详细</button>
        <button data-view="date" aria-pressed="false">仅按日期</button>
      </div>
    </div>

    <section class="panel" aria-labelledby="list-h">
      <header>
        <h2 id="list-h">在架信息</h2>
        <span class="meta">竖线为你已报名或收藏；截止已过的不再显示</span>
      </header>
      <div class="table-wrap stack" id="opp-table">
        <table>
          <thead>
            <tr>
              <th scope="col">事项</th>
              <th scope="col">主办 / 机构</th>
              <th scope="col" class="n">截止</th>
              <th scope="col" class="n">剩余</th>
              <th scope="col" class="n">费用 / 待遇</th>
              <th scope="col" class="n">状态</th>
            </tr>
          </thead>
          <tbody id="opp-body"></tbody>
        </table>
      </div>
      <ol class="date-list" id="opp-date" hidden aria-label="按截止日期分组的在架信息"></ol>
      <p class="empty" id="opp-empty" hidden>这个条件下没有在架信息。换一个类型，或取消「只看 14 天内」。</p>
    </section>

    <p class="small faint" style="margin-top:12px">信息有误？<a class="link" href="#">举报这条</a> · 平台只收录官方公开或已授权内容，不搬运付费与保密赛题。</p>
  </main>
</div>

<nav class="tabbar" aria-label="快捷导航">
  <a href="index.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="5.6"/><path d="M8 5.2v3l2 1.3" stroke-linecap="round"/></svg>
    今天
  </a>
  <a href="competitions.html" aria-current="page">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="8" cy="6" r="3.2"/><path d="M5.7 8.7 4.6 14l3.4-1.9 3.4 1.9-1.1-5.3" stroke-linejoin="round"/></svg>
    比赛
  </a>
  <a href="competitions.html?kind=academic">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="M3 13h10M4.6 9.4 11 3l2 2-6.4 6.4-2.6.6.6-2.6Z" stroke-linejoin="round"/></svg>
    征文
  </a>
  <a href="competitions.html?kind=job">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2.5" y="5.4" width="11" height="7.6" rx="1.2"/><path d="M6 5.4V4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1.4"/></svg>
    求职
  </a>
  <a href="team.html">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="6" cy="5.8" r="2.3"/><path d="M2.4 13c0-2.1 1.6-3.4 3.6-3.4s3.6 1.3 3.6 3.4" stroke-linecap="round"/></svg>
    队伍
  </a>
</nav>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
